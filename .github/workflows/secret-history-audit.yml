name: Full Git History Secret Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '18 4 * * 1'

permissions:
  contents: read

jobs:
  history-and-working-tree:
    name: Gitleaks full-history and current-files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include all branch and tag histories
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "Reachable commit count: $(git rev-list --all --count)"
          echo "Fetched branch count: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          echo "Fetched tag count: $(git for-each-ref --format='%(refname)' refs/tags | wc -l)"

      - name: Install hash-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan entire reachable history and current files
        shell: bash
        run: |
          set -euo pipefail
          report_history="${RUNNER_TEMP}/gitleaks-history.json"
          report_files="${RUNNER_TEMP}/gitleaks-files.json"
          history_status=0
          files_status=0

          # Keep reports in the ephemeral runner only; NEVER upload or echo
          # values. Full-history scan includes all fetched refs, not HEAD only.
          "${RUNNER_TEMP}/gitleaks" git \
            --no-banner --redact=100 --log-level error \
            --log-opts="--all --full-history" \
            --report-format json --report-path "$report_history" . \
            >"${RUNNER_TEMP}/gitleaks-history.log" 2>&1 || history_status=$?

          "${RUNNER_TEMP}/gitleaks" dir \
            --no-banner --redact=100 --log-level error \
            --report-format json --report-path "$report_files" . \
            >"${RUNNER_TEMP}/gitleaks-files.log" 2>&1 || files_status=$?

          if ((history_status > 1 || files_status > 1)); then
            echo "::error::Secret scanner failed to execute; results are inconclusive."
            exit 2
          fi

          history_count=0
          files_count=0
          if [[ -f "$report_history" ]]; then
            history_count="$(jq 'length' "$report_history")"
          fi
          if [[ -f "$report_files" ]]; then
            files_count="$(jq 'length' "$report_files")"
          fi

          {
            echo "## Secret audit summary"
            echo "Entire reachable Git history: $history_count finding(s)"
            echo "Current working tree: $files_count finding(s)"
            echo "Secret values and raw JSON reports are deliberately not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

          # Metadata only. No secret values, snippets, or unredacted reports.
          if (( history_count > 0 )); then
            echo "::warning::Potential historical credentials detected ($history_count)."
            jq -r '.[:30][] | [.File, (.StartLine|tostring), .RuleID, .Commit] | @tsv' "$report_history"
          fi
          if (( files_count > 0 )); then
            echo "::warning::Potential current-file credentials detected ($files_count)."
            jq -r '.[:30][] | [.File, (.StartLine|tostring), .RuleID] | @tsv' "$report_files"
          fi

          if (( history_status != 0 || files_status != 0 )); then
            echo "::error::Potential secrets found. Review metadata privately and rotate any exposed credentials."
            exit 1
          fi
          echo "No potential secrets detected by Gitleaks under these rules."

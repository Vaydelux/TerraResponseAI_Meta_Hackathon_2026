# Safe, read-only preflight for TerraResponse AI's staging Supabase project.
# This workflow never runs `supabase db push` without `--dry-run`.
name: Supabase staging migration preview

on:
  # A workflow-file change on main triggers a fresh, current-commit preview.
  # This prevents accidentally rerunning an obsolete workflow revision.
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-staging-preview.yml'
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Staging project ref (optional, overrides configured Actions Variable or Secret)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-staging-preview
  cancel-in-progress: false

jobs:
  preview:
    # Only allow execution using the reviewed workflow on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      # Accept the project reference as a Variable or Secret.
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref || vars.STAGING_SUPABASE_PROJECT_REF || secrets.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout reviewed main branch
        uses: actions/checkout@v4

      - name: Check configured staging credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || { echo "::error::Missing STAGING_SUPABASE_DB_PASSWORD secret"; exit 1; }
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::No staging project reference found. For automatic runs configure STAGING_SUPABASE_PROJECT_REF as a GitHub Actions Variable or Secret; for manually started NEW runs you can instead fill the project_ref input. Re-run jobs of an older run will never load these fixes."
            exit 1
          fi
          if ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{12,32}$ ]]; then
            echo "::error::Invalid staging project reference. Supply ONLY the lowercase reference id (not a URL or project name)."
            exit 1
          fi
          echo "Required staging configuration is present (values are not printed)."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin for reproducible --linked semantics; do not drift with CLI latest.
          version: 2.72.7

      - name: Link staging project (does not apply migrations)
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Warn on nonstandard local migration versions
        shell: bash
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            name="${file##*/}"
            if ! [[ "$name" =~ ^[0-9]{14}_[a-zA-Z0-9_-]+\.sql$ ]]; then
              echo "::warning file=$file::Nonstandard migration filename. Supabase expects YYYYMMDDHHmmss_name.sql. Do not rename an already applied migration without verifying remote migration history."
            fi
          done

      - name: Inspect applied and pending migration history
        run: supabase migration list --linked

      - name: Preview database migration changes (READ ONLY)
        run: supabase db push --dry-run --linked

      - name: Migration preview completed
        run: |
          echo "Migration preflight succeeded."
          echo "No migrations were applied; a separate approval is required for remote changes."
